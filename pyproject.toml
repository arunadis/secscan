[project]
name = "secscan"
version = "0.1.0"
description = "Hierarchical LLM-efficient security scanning for large codebases"
requires-python = ">=3.11"
dependencies = [
    "tree-sitter>=0.25.0",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-java>=0.23.5",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
    "tree-sitter-go>=0.25.0",
    # Template/view parsing (research.md A1). The only new grammar this feature needs:
    # unsafe bindings are attributes in otherwise-valid markup, so dialects without a
    # maintained wheel (Angular, Vue, JSP, Thymeleaf, Go templates) are covered by a
    # deterministic attribute/delimiter pass over the parsed HTML tree.
    "tree-sitter-html>=0.23.2",
    "pyyaml>=6.0.2",
    "jsonschema>=4.23.0",
    "click>=8.1.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "ruff>=0.9.0",
]

[project.scripts]
# Unified command surface: skill installer + scan engine.
secscan = "installer.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
skill_core = [
    "SKILL.md",
    "prompts/*.md",
    "schemas/*.json",
    "cwe_map.json",
    "data/*.json",
    "data/advisories/*.json",
]
profiles = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: long-running scans (scale/perf validation)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
